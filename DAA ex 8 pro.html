<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travelling Salesman Problem</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#11998e,#38ef7d);
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#00695c;
    margin-bottom:20px;
}

button{
    display:block;
    margin:20px auto;
    padding:12px 30px;
    background:#00695c;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#00897b;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#00695c;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ccc;
    text-align:center;
    padding:10px;
}

tr:nth-child(even){
    background:#f4f4f4;
}

.result{
    background:#f8f8f8;
    margin-top:25px;
    padding:20px;
    border-radius:10px;
}

.result p{
    font-size:18px;
    margin:10px 0;
}

ul{
    margin-left:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Travelling Salesman Problem (TSP)</h1>

<button onclick="solveTSP()">Find Optimal Tour</button>

<div id="matrix"></div>

<div id="output"></div>

</div>

<script>

const INF = Number.POSITIVE_INFINITY;

const cities=["A","B","C","D","E"];

const cost=[
[INF,10,8,9,7],
[10,INF,10,5,6],
[8,10,INF,8,9],
[9,5,8,INF,6],
[7,6,9,6,INF]
];

function permutations(arr){

    if(arr.length===0)
        return [[]];

    let result=[];

    for(let i=0;i<arr.length;i++){

        let current=arr[i];

        let remaining=arr.slice(0,i).concat(arr.slice(i+1));

        let perms=permutations(remaining);

        for(let p of perms)
            result.push([current,...p]);
    }

    return result;
}

function tspBruteForce(){

    let nodes=[1,2,3,4];

    let perms=permutations(nodes);

    let bestCost=Infinity;

    let bestPath=[];

    perms.forEach(p=>{

        let path=[0,...p,0];

        let total=0;

        for(let i=0;i<path.length-1;i++)
            total+=cost[path[i]][path[i+1]];

        if(total<bestCost){

            bestCost=total;

            bestPath=path;
        }

    });

    return{
        bestCost,
        bestPath
    };
}

function showMatrix(){

    let html="<h2>Cost Matrix</h2>";

    html+="<table>";

    html+="<tr><th></th>";

    cities.forEach(c=>html+="<th>"+c+"</th>");

    html+="</tr>";

    for(let i=0;i<cities.length;i++){

        html+="<tr>";

        html+="<th>"+cities[i]+"</th>";

        for(let j=0;j<cities.length;j++){

            if(cost[i][j]===INF)
                html+="<td>INF</td>";
            else
                html+="<td>"+cost[i][j]+"</td>";

        }

        html+="</tr>";

    }

    html+="</table>";

    document.getElementById("matrix").innerHTML=html;

}

function solveTSP(){

    showMatrix();

    let ans=tspBruteForce();

    let html="<div class='result'>";

    html+="<p><b>Optimal Tour:</b> ";

    html+=ans.bestPath.map(i=>cities[i]).join(" ➜ ");

    html+="</p>";

    html+="<p><b>Minimum Cost:</b> "+ans.bestCost+"</p>";

    html+="<h3>Path Verification</h3>";

    html+="<ul>";

    for(let i=0;i<ans.bestPath.length-1;i++){

        let u=ans.bestPath[i];

        let v=ans.bestPath[i+1];

        html+="<li>"+cities[u]+" ➜ "+cities[v]+" : Cost = "+cost[u][v]+"</li>";

    }

    html+="</ul>";

    html+="</div>";

    document.getElementById("output").innerHTML=html;

}

showMatrix();

</script>

</body>
</html>
