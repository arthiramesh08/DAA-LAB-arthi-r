<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min-Max Using Divide and Conquer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 20px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#0d47a1;
    margin-bottom:20px;
}

button{
    display:block;
    margin:20px auto;
    padding:12px 30px;
    border:none;
    background:#0d47a1;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.result{
    background:#f4f4f4;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
}

.result p{
    margin:10px 0;
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#1565c0;
    color:white;
    padding:12px;
}

table td{
    padding:10px;
    text-align:center;
    border:1px solid #ccc;
}

table tr:nth-child(even){
    background:#f2f2f2;
}
</style>

</head>
<body>

<div class="container">

<h1>Min-Max Using Divide and Conquer</h1>

<button onclick="runProgram()">Run Program</button>

<div class="result" id="output"></div>

<table id="table">
<thead>
<tr>
<th>Size</th>
<th>D&C Comparisons</th>
<th>Naive Comparisons</th>
<th>Formula (3n/2-2)</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

<script>

let comparisonCount=0;

function minMaxDC(arr,low,high){

    if(low===high){
        return{
            min:arr[low],
            max:arr[low]
        };
    }

    if(high===low+1){

        comparisonCount++;

        if(arr[low]<arr[high]){
            return{
                min:arr[low],
                max:arr[high]
            };
        }

        return{
            min:arr[high],
            max:arr[low]
        };
    }

    let mid=Math.floor((low+high)/2);

    let left=minMaxDC(arr,low,mid);

    let right=minMaxDC(arr,mid+1,high);

    comparisonCount++;

    let overallMin=(left.min<right.min)?left.min:right.min;

    comparisonCount++;

    let overallMax=(left.max>right.max)?left.max:right.max;

    return{
        min:overallMin,
        max:overallMax
    };
}

function minMaxNaive(arr){

    let mn=arr[0];
    let mx=arr[0];

    let comps=0;

    for(let i=1;i<arr.length;i++){

        comps++;

        if(arr[i]<mn)
            mn=arr[i];

        comps++;

        if(arr[i]>mx)
            mx=arr[i];
    }

    return{
        min:mn,
        max:mx,
        comps:comps
    };
}

function randomArray(size){

    let arr=[];

    for(let i=0;i<size;i++){

        arr.push(Math.floor(Math.random()*10000)+1);

    }

    return arr;
}

function runProgram(){

    let arr=[3,1,7,4,9,2,8,5,6,0];

    comparisonCount=0;

    let ans=minMaxDC(arr,0,arr.length-1);

    let dc=comparisonCount;

    let naive=minMaxNaive(arr);

    document.getElementById("output").innerHTML=
    `<p><b>Array:</b> ${arr.join(", ")}</p>
     <p><b>Minimum:</b> ${ans.min}</p>
     <p><b>Maximum:</b> ${ans.max}</p>
     <p><b>Divide & Conquer Comparisons:</b> ${dc}</p>
     <p><b>Naive Comparisons:</b> ${naive.comps}</p>`;

    let tbody=document.querySelector("#table tbody");

    tbody.innerHTML="";

    let sizes=[10,100,1000,10000];

    sizes.forEach(size=>{

        let test=randomArray(size);

        comparisonCount=0;

        minMaxDC(test,0,test.length-1);

        let dcComp=comparisonCount;

        let naiveComp=minMaxNaive(test).comps;

        let formula=Math.floor((3*size)/2)-2;

        tbody.innerHTML+=`
        <tr>
        <td>${size}</td>
        <td>${dcComp}</td>
        <td>${naiveComp}</td>
        <td>${formula}</td>
        </tr>
        `;
    });

}

</script>

</body>
</html>
