<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Sort Comparison</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#283593;
    margin-bottom:20px;
}

button{
    display:block;
    margin:20px auto;
    padding:12px 30px;
    background:#283593;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#3949ab;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th{
    background:#283593;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f2f2;
}

.info{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Deterministic vs Randomized Quick Sort</h1>

<div class="info">
<p><b>Array Size:</b> 5000</p>
</div>

<button onclick="runTest()">Run Comparison</button>

<div id="result"></div>

</div>

<script>

const N=5000;

let comparisons=0;

function partition(arr,low,high){

    let pivot=arr[high];

    let i=low-1;

    for(let j=low;j<high;j++){

        comparisons++;

        if(arr[j]<=pivot){

            i++;

            [arr[i],arr[j]]=[arr[j],arr[i]];

        }

    }

    [arr[i+1],arr[high]]=[arr[high],arr[i+1]];

    return i+1;
}

function deterministicQuickSort(arr,low,high){

    if(low<high){

        let pi=partition(arr,low,high);

        deterministicQuickSort(arr,low,pi-1);

        deterministicQuickSort(arr,pi+1,high);

    }

}

function randomizedQuickSort(arr,low,high){

    if(low<high){

        let rand=Math.floor(Math.random()*(high-low+1))+low;

        [arr[rand],arr[high]]=[arr[high],arr[rand]];

        let pi=partition(arr,low,high);

        randomizedQuickSort(arr,low,pi-1);

        randomizedQuickSort(arr,pi+1,high);

    }

}

function runAlgorithm(sortFunction,array){

    let arr=[...array];

    comparisons=0;

    let start=performance.now();

    sortFunction(arr,0,arr.length-1);

    let end=performance.now();

    return{

        comparisons:comparisons,

        time:(end-start).toFixed(2)

    };

}

function randomArray(){

    let arr=[];

    for(let i=0;i<N;i++)
        arr.push(Math.floor(Math.random()*100000)+1);

    return arr;

}

function nearlySorted(){

    let arr=[];

    for(let i=0;i<N;i++)
        arr.push(i);

    for(let i=0;i<N/20;i++){

        let a=Math.floor(Math.random()*N);

        let b=Math.floor(Math.random()*N);

        [arr[a],arr[b]]=[arr[b],arr[a]];

    }

    return arr;

}

function runTest(){

    let tests={
        "Random":randomArray(),
        "Sorted":[...Array(N).keys()],
        "Reverse":[...Array(N).keys()].reverse(),
        "Nearly Sorted":nearlySorted()
    };

    let html=`
    <table>
    <tr>
    <th>Input Type</th>
    <th>DQS Comparisons</th>
    <th>DQS Time (ms)</th>
    <th>RQS Comparisons</th>
    <th>RQS Time (ms)</th>
    </tr>
    `;

    for(let key in tests){

        let d=runAlgorithm(deterministicQuickSort,tests[key]);

        let r=runAlgorithm(randomizedQuickSort,tests[key]);

        html+=`
        <tr>
        <td>${key}</td>
        <td>${d.comparisons}</td>
        <td>${d.time}</td>
        <td>${r.comparisons}</td>
        <td>${r.time}</td>
        </tr>
        `;
    }

    html+="</table>";

    document.getElementById("result").innerHTML=html;

}

</script>

</body>
</html>
